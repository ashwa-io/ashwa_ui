name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: |
          # Browser only, no --with-deps: GitHub's Ubuntu image already has Chromium's system
          # libraries, and --with-deps pulled optional fonts from apt mirrors the runner could
          # not reach, failing releases before any test ran. Retry covers a flaky download.
          for attempt in 1 2 3; do
            yarn playwright install chromium && exit 0
            echo "Browser install failed (attempt $attempt of 3); retrying in 30s"
            sleep 30
          done
          exit 1
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn check:dist
