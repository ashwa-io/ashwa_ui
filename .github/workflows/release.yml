name: Release

# Publishes when package.json holds a version that is not on npm yet
# (bump it with `yarn version-packages`). npm trusted publishing: no token, provenance automatic.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Is this version new?
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@ashwa-io/ui@$VERSION" version > /dev/null 2>&1; then
            echo "@ashwa-io/ui@$VERSION is already on npm, nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # Same gates as CI: a merged version bump goes live with no human step.
      - if: steps.version.outputs.new == 'true'
        run: corepack enable && yarn install --immutable
      - if: steps.version.outputs.new == 'true'
        run: yarn playwright install --with-deps chromium
      - if: steps.version.outputs.new == 'true'
        run: yarn lint
      - if: steps.version.outputs.new == 'true'
        run: yarn typecheck
      - if: steps.version.outputs.new == 'true'
        run: yarn test

      - name: Publish and tag
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "npm $(npm -v)"
          npm publish --access public
          git tag "v$VERSION"
          git push origin "v$VERSION"
